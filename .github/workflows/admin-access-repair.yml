name: PCH News Admin Access Repair (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set admin password and verify editorial role
        env:
          SUPABASE_URL: https://dlfipxqtbzmmbuksppvk.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEW_PASSWORD: ${{ secrets.PCH_TEMP_ADMIN_PASSWORD }}
          ADMIN_EMAIL: pchnews.oficial@gmail.com
        run: |
          cat > /tmp/repair.mjs <<'JS'
          const { SUPABASE_URL: url, SUPABASE_SECRET_KEY: key, NEW_PASSWORD: pw, ADMIN_EMAIL: email } = process.env;
          if (!key || !pw) { console.log("missing secret"); process.exit(1); }
          const h = { apikey: key, Authorization: `Bearer ${key}`, "Content-Type": "application/json" };
          let user = null;
          for (let page = 1; page <= 20 && !user; page++) {
            const r = await fetch(`${url}/auth/v1/admin/users?page=${page}&per_page=200`, { headers: h });
            if (!r.ok) { console.log("list users failed", r.status, await r.text()); process.exit(1); }
            const j = await r.json(); const list = j.users || [];
            user = list.find(u => (u.email || "").toLowerCase() === email);
            if (list.length < 200) break;
          }
          if (!user) { console.log("auth user NOT FOUND for", email); process.exit(1); }
          console.log("auth user found:", user.id, "confirmed:", Boolean(user.email_confirmed_at), "providers:", JSON.stringify(user.app_metadata?.providers));
          const up = await fetch(`${url}/auth/v1/admin/users/${user.id}`, { method: "PUT", headers: h, body: JSON.stringify({ password: pw, email_confirm: true }) });
          console.log("password update:", up.status, up.ok ? "OK" : await up.text());
          const pr = await fetch(`${url}/rest/v1/users?openId=eq.${user.id}&select=id,openId,email,role`, { headers: h });
          const rows = await pr.json();
          console.log("public.users row:", JSON.stringify(rows));
          if (Array.isArray(rows) && rows.length && rows[0].role !== "admin") {
            const fix = await fetch(`${url}/rest/v1/users?openId=eq.${user.id}`, { method: "PATCH", headers: { ...h, Prefer: "return=representation" }, body: JSON.stringify({ role: "admin" }) });
            console.log("role -> admin:", fix.status, await fix.text());
          }
          if (!up.ok) process.exit(1);
          JS
          node /tmp/repair.mjs
