name: PCH News Database Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@adc7f6c42cdd496c1c01bd3d49bd1c9f7da9630d # v1
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start

      - name: Run database tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop
