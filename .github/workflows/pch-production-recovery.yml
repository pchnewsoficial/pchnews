name: PCH News Production Recovery Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pch-production-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source of truth
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Tests
        run: pnpm test

      - name: Build production artifact
        run: pnpm run build

      - name: Run PCH Production Recovery Agent
        run: node scripts/pch-production-recovery-agent.mjs --build
