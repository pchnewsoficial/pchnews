name: Deploy PCH News to Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    name: Build and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PCH News
        env:
          VITE_SUPABASE_URL: https://dlfipxqtbzmmbuksppvk.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_LQbform0fOesGsuiNWzd8Q_18RYf86V
        run: pnpm run build

      - name: Typecheck
        run: pnpm run check

      - name: Tests
        run: pnpm test

      - name: Authenticate Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.38.0 whoami

      - name: Configure Supabase runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: https://dlfipxqtbzmmbuksppvk.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_LQbform0fOesGsuiNWzd8Q_18RYf86V
          OWNER_OPEN_ID: ${{ secrets.OWNER_OPEN_ID }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing Supabase URL."; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Missing Supabase publishable key."; exit 1; }
          printf '%s' "$SUPABASE_URL" | pnpm dlx wrangler@4.38.0 secret put SUPABASE_URL
          printf '%s' "$SUPABASE_ANON_KEY" | pnpm dlx wrangler@4.38.0 secret put SUPABASE_ANON_KEY
          if [ -n "${OWNER_OPEN_ID:-}" ]; then
            printf '%s' "$OWNER_OPEN_ID" | pnpm dlx wrangler@4.38.0 secret put OWNER_OPEN_ID
          fi

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.38.0 deploy 2>&1 | tee /tmp/wrangler-deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "Could not determine the deployed workers.dev URL from Wrangler output."
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Public production smoke test
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          echo "Checking Worker health endpoint: $WORKER_URL/healthz"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 20             "$WORKER_URL/healthz"
          echo
          echo "Checking public SPA: $WORKER_URL/"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 20             "$WORKER_URL/" -D /tmp/pch-news-headers.txt -o /tmp/pch-news-index.html
          test -s /tmp/pch-news-index.html
          grep -qi '^content-type: text/html' /tmp/pch-news-headers.txt
          grep -q '<div id="root"></div>' /tmp/pch-news-index.html
          grep -q '<script type="module"' /tmp/pch-news-index.html
          if grep -q '"service":"pch-news"' /tmp/pch-news-index.html; then
            echo "Root URL returned the Worker health JSON instead of the React SPA."
            exit 1
          fi
          echo "Public SPA HTML verified."

      - name: Browser smoke test — execute React in Chromium
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify rendered PCH News DOM
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom "$WORKER_URL/" > /tmp/pch-news-dom.html
          grep -q "PCH News" /tmp/pch-news-dom.html
          grep -q "PUBLICIDADE" /tmp/pch-news-dom.html
          grep -q "Últimas notícias" /tmp/pch-news-dom.html
          if grep -q "An unexpected error occurred." /tmp/pch-news-dom.html; then
            echo "React ErrorBoundary rendered an application error."
            cat /tmp/pch-news-dom.html
            exit 1
          fi
          echo "Browser-rendered PCH News DOM verified."

      - name: Deployment summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          echo "PCH News production deployment completed."
          echo "Worker: pch-news"
          echo "Public URL: $WORKER_URL"
          echo "Source commit: ${GITHUB_SHA}"
