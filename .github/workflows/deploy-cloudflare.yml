name: Deploy PCH News to Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    name: Build and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PCH News
        env:
          VITE_SUPABASE_URL: https://dlfipxqtbzmmbuksppvk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_LQbform0fOesGsuiNWzd8Q_18RYf86V
          VITE_SUPABASE_ANON_KEY: sb_publishable_LQbform0fOesGsuiNWzd8Q_18RYf86V
        run: pnpm run build

      - name: Typecheck
        run: pnpm run check

      - name: Tests
        run: pnpm test

      - name: Authenticate Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.38.0 whoami

      - name: Configure Supabase runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: https://dlfipxqtbzmmbuksppvk.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_LQbform0fOesGsuiNWzd8Q_18RYf86V
          SUPABASE_ANON_KEY: sb_publishable_LQbform0fOesGsuiNWzd8Q_18RYf86V
          OWNER_OPEN_ID: ${{ secrets.OWNER_OPEN_ID }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing Supabase URL."; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Missing Supabase publishable key."; exit 1; }
          printf '%s' "$SUPABASE_URL" | pnpm dlx wrangler@4.38.0 secret put SUPABASE_URL
          printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | pnpm dlx wrangler@4.38.0 secret put SUPABASE_PUBLISHABLE_KEY
          printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | pnpm dlx wrangler@4.38.0 secret put SUPABASE_ANON_KEY
          if [ -n "${OWNER_OPEN_ID:-}" ]; then
            printf '%s' "$OWNER_OPEN_ID" | pnpm dlx wrangler@4.38.0 secret put OWNER_OPEN_ID
          fi

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.38.0 deploy 2>&1 | tee /tmp/wrangler-deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "Could not determine the deployed workers.dev URL from Wrangler output."
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Public production smoke test
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          echo "Checking Worker health endpoint: $WORKER_URL/healthz"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 20             "$WORKER_URL/healthz"
          echo
          echo "Checking public SPA: $WORKER_URL/"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 20             "$WORKER_URL/" -D /tmp/pch-news-headers.txt -o /tmp/pch-news-index.html
          test -s /tmp/pch-news-index.html
          grep -qi '^content-type: text/html' /tmp/pch-news-headers.txt
          grep -q '<div id="root"></div>' /tmp/pch-news-index.html
          grep -q '<script type="module"' /tmp/pch-news-index.html
          if grep -q '"service":"pch-news"' /tmp/pch-news-index.html; then
            echo "Root URL returned the Worker health JSON instead of the React SPA."
            exit 1
          fi
          echo "Public SPA HTML verified."

      - name: Browser smoke test — execute React in Chromium
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify rendered PCH News DOM
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom "$WORKER_URL/" > /tmp/pch-news-dom.html
          grep -q "PCH News" /tmp/pch-news-dom.html
          grep -q "PUBLICIDADE" /tmp/pch-news-dom.html
          grep -q "Últimas notícias" /tmp/pch-news-dom.html
          if grep -q "An unexpected error occurred." /tmp/pch-news-dom.html; then
            echo "React ErrorBoundary rendered an application error."
            cat /tmp/pch-news-dom.html
            exit 1
          fi
          echo "Browser-rendered PCH News DOM verified."

      - name: Verify protected Admin route and unauthenticated API behavior
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          echo "Checking published Admin route: $WORKER_URL/admin"
          status="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 \
            "$WORKER_URL/admin"             -H "Sec-Fetch-Mode: navigate"             -H "Sec-Fetch-Dest: document"             -D /tmp/admin-headers.txt -o /tmp/admin.html -w '%{http_code}')"
          echo "Published /admin HTTP status: $status"
          echo "Published /admin response headers:"
          cat /tmp/admin-headers.txt
          echo "Published /admin response body:"
          head -c 4000 /tmp/admin.html || true
          echo
          if [ "$status" != "200" ] && [ "$status" != "307" ]; then
            echo "Published /admin returned an unexpected HTTP status."
            exit 1
          fi
          if [ "$status" = "200" ]; then
            grep -qi '^content-type: text/html' /tmp/admin-headers.txt
            grep -q '<div id="root"></div>' /tmp/admin.html
            echo "Published /admin returned the real SPA entrypoint directly."
          else
            echo "Published /admin returned the platform SPA redirect; browser navigation is validated in the Chromium step below."
          fi

          echo "Checking unauthenticated protected tRPC endpoint."
          status="$(curl --silent --show-error --output /tmp/auth-me.txt --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --retry-delay 1 --max-time 20 \
            "${WORKER_URL}/api/trpc/access.list")"
          if [ "$status" != "401" ] && [ "$status" != "403" ]; then
            echo "Expected unauthenticated access.list to return HTTP 401 or 403, got $status."
            cat /tmp/auth-me.txt
            exit 1
          fi
          echo "Unauthenticated protected access.list correctly rejected with HTTP $status."

      - name: Verify published Admin rendering in Chromium
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 \
            --dump-dom "$WORKER_URL/admin" > /tmp/pch-news-admin-dom.html
          echo "Admin browser DOM (first 16000 bytes):"
          head -c 16000 /tmp/pch-news-admin-dom.html || true
          echo
          if grep -q "An unexpected error occurred." /tmp/pch-news-admin-dom.html; then
            echo "React ErrorBoundary rendered an application error on /admin."
            cat /tmp/pch-news-admin-dom.html
            exit 1
          fi
          if grep -q "FALHA DE AUTENTICAÇÃO" /tmp/pch-news-admin-dom.html; then
            echo "Admin route rendered an authentication failure instead of the login/protected-access UI."
            cat /tmp/pch-news-admin-dom.html
            exit 1
          fi
          grep -q "PCH News" /tmp/pch-news-admin-dom.html
          echo "Published /admin rendered the protected PCH News UI without a blank page."
      - name: Verify Lovable production rendering
        run: |
          set -euo pipefail
          TARGET="https://pch-news.lovable.app/"
          echo "Checking published Lovable production: $TARGET"
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 \
            --dump-dom "$TARGET" > /tmp/lovable-production-dom.html
          echo "Lovable DOM title/content markers:"
          grep -o "<title>[^<]*</title>" /tmp/lovable-production-dom.html | head -5 || true
          grep -o "PCH News" /tmp/lovable-production-dom.html | head -5 || true
          grep -o "PUBLICIDADE" /tmp/lovable-production-dom.html | head -5 || true
          grep -o "Últimas notícias" /tmp/lovable-production-dom.html | head -5 || true
          if grep -q "x-lovable-serve-error\|502 Bad Gateway\|A pré-visualização ainda não foi criada\|An unexpected error occurred." /tmp/lovable-production-dom.html; then
            echo "Lovable production rendered an error state."
            cat /tmp/lovable-production-dom.html
            exit 1
          fi
          echo "Lovable production browser rendering verified."
      - name: Verify Lovable production Admin route
        run: |
          set -euo pipefail
          TARGET="https://id-preview--50a4b9f4-d0a8-4f19-a810-c59546a0d4f9.lovable.app/admin"
          echo "Checking Lovable Preview Admin route: $TARGET"
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 \
            --dump-dom "$TARGET" > /tmp/lovable-admin-dom.html 2>/tmp/lovable-admin-chrome.err || true
          echo "Lovable Admin DOM:"
          head -c 16000 /tmp/lovable-admin-dom.html || true
          echo
          echo "Lovable Admin Chrome diagnostics:"
          cat /tmp/lovable-admin-chrome.err || true
          grep -q "PCH News" /tmp/lovable-admin-dom.html
          grep -q "ACESSO OFICIAL\|Entre na sua\|redação" /tmp/lovable-admin-dom.html
          if grep -q "An unexpected error occurred.\|502 Bad Gateway\|Not Found" /tmp/lovable-admin-dom.html; then
            echo "Lovable /admin rendered an error state."
            exit 1
          fi
          echo "Lovable Preview /admin rendered the protected login/access UI."
      - name: Deployment summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          echo "PCH News production deployment completed."
          echo "Worker: pch-news"
          echo "Public URL: $WORKER_URL"
          echo "Source commit: ${GITHUB_SHA}"
