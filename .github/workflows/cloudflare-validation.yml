name: PCH News Cloudflare Validation

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PCH News
        run: pnpm run build

      - name: Typecheck
        run: pnpm run check

      - name: Tests
        run: pnpm test

      - name: Validate Cloudflare Worker bundle
        run: pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@latest deploy --dry-run
